# ==============================================================================
# Nginx Configuration for https://medcarejkndummy.akhzafachrozy.my.id
# JKN Integrity Intelligence / Medcare JKN
# ==============================================================================

# 1. Redirect HTTP (Port 80) -> HTTPS (Port 443)
server {
    listen 80;
    listen [::]:80;
    server_name medcarejkndummy.akhzafachrozy.my.id;

    # Let's Encrypt ACME Challenge location for Certbot renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Server (Port 443)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name medcarejkndummy.akhzafachrozy.my.id;

    # SSL Certificate Paths (Let's Encrypt / Certbot)
    ssl_certificate /etc/letsencrypt/live/medcarejkndummy.akhzafachrozy.my.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/medcarejkndummy.akhzafachrozy.my.id/privkey.pem;

    # Modern SSL Protocols & Ciphers (A+ Security)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Gzip Compression for Faster Loading
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Maximum upload size (adjust if uploading medical files)
    client_max_body_size 25M;

    # Reverse Proxy to Node.js App
    # Catatan: Ubah port 5173 ke 3000 jika backend Anda berjalan di port 3000
    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
