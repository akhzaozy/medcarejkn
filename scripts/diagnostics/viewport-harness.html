<!doctype html><html lang="id"><meta charset="utf-8"><title>QA viewport medCare</title><style>body{margin:12px;font:14px system-ui;background:#e9f0ef;color:#294944}button{padding:8px;margin:3px}#stage{transform-origin:top left;border:0;background:white}#wrap{overflow:hidden;margin-top:12px}output{display:block;margin:10px}</style><strong>QA lokal — viewport iframe aplikasi</strong><nav><button data-size="1366,768">1366 × 768</button><button data-size="1920,1080">1920 × 1080</button><button data-size="1093,614">Area setara zoom 125%</button><button data-size="390,844">390 × 844</button><button data-size="320,740">320 × 740</button></nav><output id="measure"></output><div id="wrap"><iframe id="stage" src="/" title="Aplikasi dalam viewport pengujian"></iframe></div><script>
const stage=document.querySelector('#stage'),wrap=document.querySelector('#wrap'),measure=document.querySelector('output');let width=1366,height=768;
function resize(){const scale=Math.min(1,(innerWidth-24)/width);stage.width=width;stage.height=height;stage.style.transform=`scale(${scale})`;wrap.style.height=`${height*scale}px`;measure.textContent=`Viewport ${width} × ${height} CSS px · pratinjau ${Math.round(scale*100)}%`;}
document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{[width,height]=b.dataset.size.split(',').map(Number);resize();});addEventListener('resize',resize);resize();
</script></html>
